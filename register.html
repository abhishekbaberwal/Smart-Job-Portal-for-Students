<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Register — SmartJobs</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/responsive.css" />
</head>
<body>
  <!-- ===================== REGISTER SECTION ===================== -->
  <section class="py-5 bg-light-section">
    <div class="container">
      <div class="card auth-card p-4 p-md-5">
        <div class="text-center mb-4">
          <i class="bi bi-briefcase-fill text-primary fs-2"></i>
          <h3 class="fw-bold mt-2 mb-1">Create Your Account</h3>
          <p class="text-secondary small mb-0">Join SmartJobs and find your first opportunity</p>
        </div>

        <!-- Validation is not wired up with JS yet — HTML5 'required' attributes only for now -->
        <form id="registerForm" onsubmit="return false;" novalidate>

          <div class="mb-3">
            <label for="fullName" class="form-label small fw-medium">Full Name</label>
            <div class="input-group">
              <span class="input-group-text bg-white"><i class="bi bi-person"></i></span>
              <input type="text" class="form-control" id="fullName" placeholder="Enter your full name" required />
            </div>
            <div class="invalid-feedback">Please enter your full name.</div>
          </div>

          <div class="mb-3">
            <label for="email" class="form-label small fw-medium">Email</label>
            <div class="input-group">
              <span class="input-group-text bg-white"><i class="bi bi-envelope"></i></span>
              <input type="email" class="form-control" id="email" placeholder="you@example.com" required />
            </div>
            <div class="invalid-feedback">Please enter a valid email address.</div>
          </div>

          <div class="mb-3">
            <label for="password" class="form-label small fw-medium">Password</label>
            <div class="input-group">
              <span class="input-group-text bg-white"><i class="bi bi-lock"></i></span>
              <input type="password" class="form-control" id="password" placeholder="Create a password" minlength="6" required />
            </div>
            <div class="invalid-feedback">Password must be at least 6 characters.</div>
          </div>

          <div class="mb-3">
            <label for="confirmPassword" class="form-label small fw-medium">Confirm Password</label>
            <div class="input-group">
              <span class="input-group-text bg-white"><i class="bi bi-lock-fill"></i></span>
              <input type="password" class="form-control" id="confirmPassword" placeholder="Re-enter your password" required />
            </div>
            <div class="invalid-feedback">Passwords do not match.</div>
          </div>

          <div class="mb-4">
            <label class="form-label small fw-medium d-block">I am registering as</label>
            <div class="d-flex gap-3">
              <div class="form-check">
                <input class="form-check-input" type="radio" name="userType" id="typeStudent" value="student" checked />
                <label class="form-check-label" for="typeStudent">
                  <i class="bi bi-mortarboard me-1"></i>Student
                </label>
              </div>
              <div class="form-check">
                <input class="form-check-input" type="radio" name="userType" id="typeRecruiter" value="recruiter" />
                <label class="form-check-label" for="typeRecruiter">
                  <i class="bi bi-building me-1"></i>Recruiter
                </label>
              </div>
            </div>
          </div>

          <button type="submit" class="btn btn-primary w-100 py-2">Create Account</button>

          <p class="text-center small text-secondary mt-4 mb-0">
            Already have an account?
            <a href="login.html" class="fw-medium">Login here</a>
          </p>
        </form>
      </div>
    </div>
  </section>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="js/main.js"></script>
  <script src="js/validation.js"></script>
</body>
</html>
